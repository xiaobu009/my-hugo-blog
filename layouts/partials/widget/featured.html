<section class="widget archives">
    <div class="widget-header">
        <div class="widget-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" 
                 stroke-width="1.5" stroke="currentColor" fill="none">
                <path stroke-linecap="round" stroke-linejoin="round" 
                      d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/>
            </svg>
        </div>
        <h2 class="widget-title section-title">精选文章</h2>
    </div>

    <div class="widget-body">
        {{ range where .Context.Site.RegularPages "Params.featured" "==" true }}
        <a href="{{ .RelPermalink }}" 
           style="display:block; padding:6px 0; border-bottom:1px solid var(--card-separator-color); font-size:1.4rem; line-height:1.4rem;">
            → {{ .Title }}
        </a>
        {{ end }}
    </div>
</section>
